# Supabase project configuration for the Multiplayer AI Planning Room V1.
# See https://supabase.com/docs/guides/local-development/cli/config

project_id = "multi-ai-room"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
# Broadcast and presence channels are used for instant, opaque room tickers.
# Message content is never broadcast; browsers fetch it through Edge Functions.
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "6MiB"

[auth]
enabled = false
# V1 rooms have no accounts. Participants authenticate with a per-room session
# token issued by the join-room Edge Function, not Supabase Auth.

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.create-room]
verify_jwt = false
[functions.join-room]
verify_jwt = false
[functions.room-state]
verify_jwt = false
[functions.post-message]
verify_jwt = false
[functions.upload-screenshot]
verify_jwt = false
[functions.signed-url]
verify_jwt = false
[functions.connect-code]
verify_jwt = false
[functions.agent-connect]
verify_jwt = false
[functions.agent-heartbeat]
verify_jwt = false
[functions.agent-disconnect]
verify_jwt = false
[functions.send-handoff]
verify_jwt = false
[functions.agent-fetch-handoff]
verify_jwt = false
[functions.agent-respond]
verify_jwt = false
[functions.cleanup]
verify_jwt = false
