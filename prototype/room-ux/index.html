<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room UX Prototype</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #6e7b87;
      --line: #e3e8ed;
      --accent: #3468f5;
      --accent-soft: #edf2ff;
      --agent: #17202a;
      --green: #24a36b;
      --shadow: 0 18px 55px rgba(23, 32, 42, .09);
      --radius: 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--bg); }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .prototype-badge { position: fixed; z-index: 20; top: 14px; right: 14px; padding: 7px 10px; border: 1px solid #f0c36b; border-radius: 999px; background: #fff9e9; color: #8b5f12; font-size: 11px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; }
    .shell { min-height: 100vh; }
    .topbar { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.84); backdrop-filter: blur(14px); }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.03em; }
    .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; color: white; background: var(--accent); font-size: 14px; box-shadow: 0 6px 14px rgba(52,104,245,.28); }
    .room-meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
    .room-code { padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fbfcfd; font-weight: 700; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(36,163,107,.11); }
    .btn { min-height: 40px; padding: 0 15px; border: 1px solid transparent; border-radius: 11px; background: var(--ink); color: #fff; font-weight: 750; font-size: 13px; transition: transform .16s, box-shadow .16s, background .16s; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(23,32,42,.14); }
    .btn.secondary { border-color: var(--line); background: white; color: var(--ink); }
    .btn.blue { background: var(--accent); }
    .btn.ghost { min-height: 34px; padding: 0 10px; background: transparent; color: var(--muted); }
    .avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: white; background: #8a5cf5; font-size: 11px; font-weight: 800; }
    .avatar.orange { background: #e88943; }
    .avatar.green { background: #25a478; }
    .avatar.gray { background: #8793a1; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .page-title h1 { margin: 0; font-size: 25px; letter-spacing: -.04em; }
    .page-title p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 800; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .participants { display: flex; align-items: center; gap: 7px; }
    .participants .avatar { margin-left: -4px; border: 2px solid white; }
    .participants .avatar:first-child { margin-left: 0; }
    .online-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .online-label .live-dot { width: 6px; height: 6px; }
    .message { display: flex; gap: 12px; }
    .message + .message { margin-top: 23px; }
    .message-body { min-width: 0; flex: 1; }
    .message-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 6px; }
    .message-name { font-size: 13px; font-weight: 800; }
    .message-time { color: var(--muted); font-size: 11px; }
    .message-copy { margin: 0; color: #34414d; font-size: 14px; line-height: 1.65; }
    .agent-message { padding: 17px; border-radius: 13px; background: #f1f4f7; }
    .agent-message .message-copy { color: #25313b; }
    .agent-label { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 11px; color: var(--ink); font-size: 11px; font-weight: 850; letter-spacing: .04em; text-transform: uppercase; }
    .agent-label span { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 6px; color: white; background: var(--ink); font-size: 9px; }
    .agent-message ol { margin: 11px 0 0 18px; padding: 0; color: #34414d; font-size: 13px; line-height: 1.8; }
    .composer { padding: 13px; border: 1px solid var(--line); border-radius: 15px; background: white; }
    .composer textarea { width: 100%; min-height: 62px; resize: vertical; border: 0; outline: 0; color: var(--ink); line-height: 1.5; }
    .composer textarea::placeholder { color: #a3adb7; }
    .composer-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px; border-top: 1px solid #eef1f3; }
    .composer-tools { display: flex; align-items: center; gap: 5px; }
    .icon-btn { width: 33px; height: 33px; display: grid; place-items: center; border: 0; border-radius: 9px; color: var(--muted); background: transparent; font-size: 16px; }
    .icon-btn:hover { background: #f1f4f7; color: var(--ink); }
    .empty-surface { display: grid; place-items: center; min-height: 500px; padding: 50px; text-align: center; }
    .empty-surface .orb { width: 68px; height: 68px; display: grid; place-items: center; margin-bottom: 22px; border-radius: 22px; color: var(--accent); background: var(--accent-soft); font-size: 29px; }
    .empty-surface h2 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
    .empty-surface p { max-width: 380px; margin: 10px 0 23px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .attach-preview { display: none; align-items: center; gap: 9px; margin-top: 10px; padding: 8px; border-radius: 10px; background: #f5f7f9; font-size: 12px; }
    .attach-preview.visible { display: flex; }
    .attach-thumb { width: 34px; height: 34px; border-radius: 7px; object-fit: cover; background: #dbe3ec; }
    .status-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .status-line strong { color: var(--ink); }
    .send-state { min-height: 35px; display: none; align-items: center; justify-content: center; gap: 8px; padding: 0 10px; border-radius: 9px; color: #1b7750; background: #ecfaf3; font-size: 12px; font-weight: 750; }
    .send-state.visible { display: flex; }

    /* Variant A — calm focus */
    .variant-a .content { max-width: 1120px; margin: 0 auto; padding: 42px 28px 130px; }
    .variant-a .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .variant-a .timeline-card { max-width: 760px; margin: 0 auto; padding: 27px 30px 20px; }
    .variant-a .timeline { min-height: 475px; padding: 10px 2px 26px; }
    .variant-a .composer { position: sticky; bottom: 22px; box-shadow: 0 12px 35px rgba(23,32,42,.12); }

    /* Variant B — workbench */
    .variant-b { background: #eef1f4; }
    .variant-b .content { display: grid; grid-template-columns: 230px minmax(0, 1fr) 290px; gap: 15px; max-width: 1440px; margin: 0 auto; padding: 25px 24px 100px; }
    .variant-b .side-panel { align-self: start; padding: 18px; }
    .variant-b .side-panel h3 { margin: 0 0 17px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .variant-b .person { display: flex; align-items: center; gap: 9px; padding: 9px 0; }
    .variant-b .person-info { min-width: 0; }
    .variant-b .person-name { font-size: 12px; font-weight: 800; }
    .variant-b .person-role { color: var(--muted); font-size: 10px; }
    .variant-b .center { min-width: 0; }
    .variant-b .center-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 17px; }
    .variant-b .timeline-card { padding: 22px 25px 17px; }
    .variant-b .timeline { min-height: 510px; }
    .variant-b .right-panel { align-self: start; padding: 20px; }
    .variant-b .right-panel h2 { margin: 0; font-size: 16px; letter-spacing: -.03em; }
    .variant-b .right-panel p { margin: 8px 0 18px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .agent-status { display: flex; align-items: center; gap: 10px; padding: 11px; border-radius: 11px; background: #f1f4f7; }
    .agent-status .agent-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: var(--ink); color: white; font-size: 11px; font-weight: 800; }
    .agent-status strong { display: block; font-size: 12px; }
    .agent-status span { display: block; margin-top: 2px; color: var(--green); font-size: 10px; font-weight: 700; }
    .context-list { margin: 20px 0 0; padding: 0; list-style: none; }
    .context-list li { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .context-list strong { color: var(--ink); font-size: 11px; }

    /* Variant C — briefing */
    .variant-c { background: #f7f8f5; }
    .variant-c .topbar { background: rgba(255,255,255,.7); }
    .variant-c .content { max-width: 1040px; margin: 0 auto; padding: 33px 25px 130px; }
    .variant-c .brief-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
    .variant-c .brief-head h1 { max-width: 600px; margin: 0; font-size: 36px; line-height: 1.06; letter-spacing: -.06em; }
    .variant-c .brief-head p { max-width: 510px; margin: 13px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .variant-c .brief-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr); gap: 30px; margin-top: 28px; }
    .variant-c .discussion { min-width: 0; }
    .variant-c .discussion > .section-label, .variant-c .reference > .section-label { display: block; margin-bottom: 14px; color: var(--muted); font-size: 10px; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    .variant-c .message { padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .variant-c .message + .message { margin-top: 20px; }
    .variant-c .reference { position: sticky; top: 95px; align-self: start; }
    .mock-shot { overflow: hidden; border: 1px solid #dfe5df; border-radius: 15px; background: white; box-shadow: 0 10px 28px rgba(26,43,31,.07); }
    .mock-shot-top { display: flex; gap: 5px; padding: 11px 12px; border-bottom: 1px solid #edf0ec; background: #fbfcfa; }
    .mock-shot-top i { width: 7px; height: 7px; border-radius: 50%; background: #f0bd68; }
    .mock-shot-top i:nth-child(2) { background: #8ecb9c; }
    .mock-shot-top i:nth-child(3) { background: #d98a8a; }
    .mock-shot-body { display: grid; grid-template-columns: 58px 1fr; min-height: 190px; }
    .mock-nav { padding: 16px 11px; background: #17231c; }
    .mock-nav b { display: block; width: 27px; height: 7px; margin-bottom: 18px; border-radius: 4px; background: #d0ead8; }
    .mock-nav span { display: block; width: 28px; height: 5px; margin: 12px 0; border-radius: 3px; background: #60776a; }
    .mock-main { padding: 20px; background: #f6faf6; }
    .mock-main h4 { width: 120px; height: 9px; margin: 0 0 15px; border-radius: 5px; background: #294335; }
    .mock-card-row { display: flex; gap: 9px; }
    .mock-card { width: 62px; height: 62px; border: 1px solid #dce9df; border-radius: 10px; background: white; }
    .mock-card::before { content: ""; display: block; width: 23px; height: 23px; margin: 12px auto 7px; border-radius: 7px; background: #d8eee0; }
    .variant-c .composer { margin-top: 31px; }
    .variant-c .participants-row { display: flex; align-items: center; gap: 10px; margin-top: 18px; }

    /* Variant D — review workspace inspired by Plannotator */
    .variant-d { --d-bg: #0b0f15; --d-panel: #111720; --d-panel-2: #151c26; --d-line: #27313d; --d-muted: #8995a4; background: var(--d-bg); color: #e8edf3; }
    .variant-d .topbar { border-color: var(--d-line); background: #0f141c; color: #e8edf3; }
    .variant-d .brand-mark { background: #8b5cf6; box-shadow: 0 6px 14px rgba(139,92,246,.28); }
    .variant-d .room-meta { color: var(--d-muted); }
    .variant-d .room-code { border-color: var(--d-line); color: #e8edf3; background: var(--d-panel); }
    .variant-d .btn.secondary { border-color: var(--d-line); color: #e8edf3; background: var(--d-panel); }
    .variant-d .content { display: grid; grid-template-columns: 240px minmax(0, 1fr) 350px; min-height: calc(100vh - 72px); max-width: 1500px; margin: 0 auto; padding: 0; }
    .variant-d .d-left, .variant-d .d-center, .variant-d .d-discussion { min-width: 0; padding: 25px 22px 115px; }
    .variant-d .d-left { border-right: 1px solid var(--d-line); }
    .variant-d .d-discussion { border-left: 1px solid var(--d-line); background: #0e141c; }
    .variant-d .d-kicker { display: block; margin-bottom: 10px; color: #8b5cf6; font-size: 10px; font-weight: 850; letter-spacing: .14em; }
    .variant-d h1, .variant-d h2, .variant-d h3 { letter-spacing: -.04em; }
    .variant-d .d-left h1 { margin: 0; font-size: 22px; }
    .variant-d .d-left p { color: var(--d-muted); font-size: 12px; line-height: 1.55; }
    .variant-d .d-divider { height: 1px; margin: 25px 0; background: var(--d-line); }
    .variant-d .d-participants { display: grid; gap: 12px; }
    .variant-d .d-person { display: flex; align-items: center; gap: 9px; }
    .variant-d .d-person strong { display: block; font-size: 12px; }
    .variant-d .d-person span { display: block; margin-top: 2px; color: var(--d-muted); font-size: 10px; }
    .variant-d .d-agent { display: flex; align-items: center; gap: 10px; padding: 11px; border: 1px solid #334253; border-radius: 12px; background: var(--d-panel-2); }
    .variant-d .d-agent-icon { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 8px; color: #fff; background: #8b5cf6; font-size: 12px; font-weight: 850; }
    .variant-d .d-agent strong { display: block; font-size: 11px; }
    .variant-d .d-agent span { display: block; margin-top: 3px; color: #68d391; font-size: 10px; }
    .variant-d .d-center { padding: 34px 36px 115px; }
    .variant-d .d-center-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 17px; }
    .variant-d .d-center-head span, .variant-d .d-discussion > .d-kicker { color: var(--d-muted); font-size: 10px; font-weight: 850; letter-spacing: .14em; }
    .variant-d .d-artifact { overflow: hidden; border: 1px solid var(--d-line); border-radius: 17px; background: var(--d-panel); box-shadow: 0 18px 55px rgba(0,0,0,.2); }
    .variant-d .d-artifact-head { padding: 25px 28px 22px; border-bottom: 1px solid var(--d-line); background: linear-gradient(130deg, #151d29, #111720); }
    .variant-d .d-artifact-head h2 { margin: 0; font-size: 27px; }
    .variant-d .d-artifact-head p { max-width: 610px; margin: 11px 0 0; color: #aab5c1; font-size: 14px; line-height: 1.65; }
    .variant-d .d-artifact-body { padding: 25px 28px 30px; }
    .variant-d .d-plan-block { padding: 17px 18px; border: 1px solid #334253; border-radius: 12px; background: var(--d-panel-2); }
    .variant-d .d-plan-block > span { color: #a9b5c2; font-size: 10px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
    .variant-d .d-plan-block ol { margin: 12px 0 0 19px; padding: 0; color: #d4dce5; font-size: 13px; line-height: 1.8; }
    .variant-d .d-reference { display: flex; gap: 13px; align-items: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--d-line); }
    .variant-d .d-reference .mock-shot { width: 95px; flex: 0 0 auto; border-color: #334253; box-shadow: none; }
    .variant-d .d-reference .mock-shot-body { min-height: 63px; grid-template-columns: 24px 1fr; }
    .variant-d .d-reference .mock-nav { padding: 8px 5px; }
    .variant-d .d-reference .mock-nav b { width: 14px; height: 4px; margin-bottom: 8px; }
    .variant-d .d-reference .mock-nav span { width: 13px; height: 3px; margin: 6px 0; }
    .variant-d .d-reference .mock-main { padding: 9px; }
    .variant-d .d-reference .mock-main h4 { width: 45px; height: 4px; margin-bottom: 8px; }
    .variant-d .d-reference .mock-card { width: 22px; height: 22px; border-radius: 4px; }
    .variant-d .d-reference .mock-card::before { width: 8px; height: 8px; margin: 5px auto 2px; border-radius: 3px; }
    .variant-d .d-reference p { margin: 0; color: var(--d-muted); font-size: 11px; line-height: 1.5; }
    .variant-d .d-discussion .message-copy { color: #cbd4de; }
    .variant-d .d-discussion .message-head { color: #e8edf3; }
    .variant-d .d-discussion .message-time { color: var(--d-muted); }
    .variant-d .d-discussion .agent-message { background: var(--d-panel-2); }
    .variant-d .d-discussion .agent-message .message-copy, .variant-d .d-discussion .agent-message ol { color: #cbd4de; }
    .variant-d .d-discussion .composer { margin-top: 25px; border-color: var(--d-line); background: var(--d-panel); }
    .variant-d .d-discussion .composer textarea { color: #e8edf3; background: transparent; }
    .variant-d .d-discussion .composer textarea::placeholder { color: #788595; }
    .variant-d .d-discussion .composer-foot { border-color: var(--d-line); }
    .variant-d .d-discussion .icon-btn { color: var(--d-muted); }
    .variant-d .d-discussion .muted { color: var(--d-muted); }
    .variant-d .d-discussion .message + .message { margin-top: 20px; }

    .switcher { position: fixed; z-index: 30; bottom: 18px; left: 50%; display: flex; align-items: center; gap: 11px; transform: translateX(-50%); padding: 8px 10px; border: 1px solid #303a44; border-radius: 999px; background: #202a33; color: white; box-shadow: 0 15px 35px rgba(23,32,42,.25); }
    .switcher button { width: 30px; height: 30px; border: 0; border-radius: 50%; color: white; background: #34414c; font-size: 17px; }
    .switcher button:hover { background: #4a5b69; }
    .switcher-label { min-width: 145px; text-align: center; font-size: 11px; font-weight: 750; }
    @media (max-width: 930px) {
      .variant-b .content { grid-template-columns: 190px minmax(0, 1fr); }
      .variant-b .right-panel { display: none; }
      .variant-c .brief-grid { grid-template-columns: 1fr; }
      .variant-c .reference { position: static; max-width: 420px; }
      .variant-d .content { grid-template-columns: 190px minmax(0, 1fr); }
      .variant-d .d-discussion { display: none; }
    }
    @media (max-width: 650px) {
      .topbar { height: auto; min-height: 64px; padding: 14px 17px; }
      .room-meta .room-code, .room-meta .online-label { display: none; }
      .variant-a .content, .variant-c .content { padding: 27px 16px 120px; }
      .variant-d .content { display: block; }
      .variant-d .d-left { display: none; }
      .variant-d .d-center { padding: 27px 16px 120px; }
      .variant-d .d-center-head { align-items: flex-start; }
      .variant-d .d-center-head .btn { padding: 0 10px; }
      .variant-a .intro { display: block; }
      .variant-a .intro .participants { margin-top: 18px; }
      .variant-a .timeline-card { padding: 18px 16px 15px; }
      .variant-b .content { display: block; padding: 18px 14px 120px; }
      .variant-b .side-panel { display: none; }
      .variant-b .center-head { display: block; }
      .variant-b .center-head .participants { margin-top: 13px; }
      .variant-c .brief-head { display: block; }
      .variant-c .brief-head h1 { font-size: 31px; }
      .switcher-label { min-width: 112px; }
    }
  </style>
</head>
<body>
  <div class="prototype-badge">Prototype · UX only</div>
  <div id="app"></div>

  <script>
    const variants = [
      { key: 'A', name: 'Calm focus' },
      { key: 'B', name: 'Agent workbench' },
      { key: 'C', name: 'Briefing room' },
      { key: 'D', name: 'Review workspace' }
    ];
    const params = new URLSearchParams(location.search);
    let current = (params.get('variant') || 'A').toUpperCase();
    if (!variants.some(v => v.key === current)) current = 'A';
    let connected = true;
    let messages = [
      { person: 'Maya', initials: 'M', color: '', time: '10:04', text: 'We need a shorter onboarding flow for new users. The current profile form is making people drop before they reach the dashboard.' },
      { person: 'Priya', initials: 'P', color: 'orange', time: '10:07', text: 'The first screen should feel more like a welcome than a form. I added the latest direction on the right.' },
      { person: 'Leo', initials: 'L', color: 'green', time: '10:11', text: 'We already have the profile API. I want Pi to check whether incomplete profiles can safely reach the new flow.' },
      { agent: true, time: '10:12', text: 'I found the existing onboarding route and profile state. Here is a first implementation direction:', steps: ['Add an incomplete-profile state without changing the existing auth contract.', 'Split onboarding into three small steps and reuse the profile API.', 'Guard dashboard access until the minimum profile fields are complete.'] }
    ];

    function avatar(person, initials, color = '') { return `<span class="avatar ${color}">${initials}</span>`; }
    function participants() { return `<div class="participants">${avatar('Maya','M')}${avatar('Priya','P','orange')}${avatar('Leo','L','green')}<span class="online-label"><i class="live-dot"></i> 3 online</span></div>`; }
    function topbar() {
      return `<header class="topbar"><div class="brand"><span class="brand-mark">↗</span><span>room / onboarding</span></div><div class="room-meta"><span class="online-label"><i class="live-dot"></i> live</span><span class="room-code">ABC 123</span><button class="btn secondary" onclick="copyRoom()">Copy invite</button></div></header>`;
    }
    function messageMarkup(message) {
      if (message.agent) return `<article class="message"><div class="avatar gray">π</div><div class="message-body agent-message"><div class="agent-label"><span>π</span> Pi · plan response <em class="message-time">${message.time}</em></div><p class="message-copy">${message.text}</p><ol>${message.steps.map(step => `<li>${step}</li>`).join('')}</ol></div></article>`;
      return `<article class="message"><div>${avatar(message.person, message.initials, message.color)}</div><div class="message-body"><div class="message-head"><span class="message-name">${message.person}</span><span class="message-time">${message.time}</span></div><p class="message-copy">${message.text}</p></div></article>`;
    }
    function timeline() { return messages.map(messageMarkup).join(''); }
    function composer() {
      return `<div class="composer"><textarea id="composerInput" placeholder="Add a requirement, question, or suggestion…"></textarea><div id="attachPreview" class="attach-preview"><img id="attachThumb" class="attach-thumb" alt="Attached screenshot preview"><span id="attachName"></span><button class="btn ghost" onclick="clearAttachment()">Remove</button></div><div class="composer-foot"><div class="composer-tools"><label class="icon-btn" title="Attach screenshot">⌕<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden onchange="attachFile(event)"></label><button class="icon-btn" title="Attach screenshot" onclick="document.getElementById('fileInput').click()">＋</button><span class="muted small">Screenshots welcome</span></div><div style="display:flex; align-items:center; gap:9px"><div id="sendState" class="send-state">✓ Sent to Pi</div><button class="btn blue" onclick="sendToRoom()">Send to room</button><button class="btn" onclick="sendToAgent()">Send to agent ↗</button></div></div></div>`;
    }
    function pageHeader() { return `<div class="page-title"><span class="pill"><i class="live-dot" style="width:6px;height:6px;background:var(--accent)"></i> Team planning room</span><h1>Turn the discussion into a plan.</h1><p>Share the requirement, add context, and send the new conversation to the active Pi agent when it is ready.</p></div>`; }

    function variantA() {
      return `<div class="shell variant-a">${topbar()}<main class="content"><div class="intro">${pageHeader()}${participants()}</div><section class="card timeline-card"><div class="timeline">${timeline()}</div>${composer()}</section></main></div>`;
    }
    function variantB() {
      return `<div class="shell variant-b">${topbar()}<main class="content"><aside class="card side-panel"><h3>Participants</h3><div class="person">${avatar('Maya','M')}<div class="person-info"><div class="person-name">Maya</div><div class="person-role">Product</div></div></div><div class="person">${avatar('Priya','P','orange')}<div class="person-info"><div class="person-name">Priya</div><div class="person-role">Design</div></div></div><div class="person">${avatar('Leo','L','green')}<div class="person-info"><div class="person-name">Leo</div><div class="person-role">Engineering</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="status-line"><i class="live-dot"></i><strong>Pi active</strong></div><p class="muted small" style="line-height:1.55;margin-bottom:0">Anyone can send the latest discussion to the active agent.</p></aside><section class="center"><div class="center-head"><div><span class="pill">Live discussion</span><h1 style="margin:9px 0 0;font-size:22px;letter-spacing:-.04em">Onboarding flow</h1></div>${participants()}</div><section class="card timeline-card"><div class="timeline">${timeline()}</div>${composer()}</section></section><aside class="card right-panel"><h2>Agent context</h2><p>Pi will receive new messages and screenshots since the last handoff.</p><div class="agent-status"><div class="agent-icon">π</div><div><strong>Pi · Leo’s machine</strong><span>${connected ? 'Active and ready' : 'Offline'}</span></div></div><ul class="context-list"><li><span>New messages</span><strong>3</strong></li><li><span>Attachments</span><strong>1 image</strong></li><li><span>Last sent</span><strong>10:02</strong></li></ul><button class="btn blue" style="width:100%;margin-top:21px" onclick="sendToAgent()">Send to agent ↗</button></aside></main></div>`;
    }
    function variantC() {
      return `<div class="shell variant-c">${topbar()}<main class="content"><div class="brief-head"><div><span class="pill">Shared brief</span><h1>Onboarding should feel like a welcome, not a checklist.</h1><p>Three people are shaping one implementation direction. Pi is ready when the team agrees the context is complete.</p><div class="participants-row">${participants()}</div></div><div style="text-align:right"><div class="status-line" style="justify-content:flex-end"><i class="live-dot"></i><strong>Pi active</strong></div><button class="btn blue" style="margin-top:14px" onclick="sendToAgent()">Send to agent ↗</button></div></div><div class="brief-grid"><section class="discussion"><span class="section-label">Discussion · 4 messages</span>${timeline()}<div style="margin-top:27px">${composer()}</div></section><aside class="reference"><span class="section-label">Design reference</span><div class="mock-shot"><div class="mock-shot-top"><i></i><i></i><i></i></div><div class="mock-shot-body"><div class="mock-nav"><b></b><span></span><span></span><span></span></div><div class="mock-main"><h4></h4><div class="mock-card-row"><div class="mock-card"></div><div class="mock-card"></div><div class="mock-card"></div></div></div></div></div><p class="muted small" style="line-height:1.6;margin-top:11px">A screenshot stays visible to the room and is included in the next handoff when the connected model supports vision.</p></aside></div></main></div>`;
    }
    function variantD() {
      return `<div class="shell variant-d">${topbar()}<main class="content"><aside class="d-left"><span class="d-kicker">ROOM CONTEXT</span><h1>Onboarding flow</h1><p>One shared requirement, shaped by product, design, engineering, and Pi.</p><div class="d-divider"></div><span class="d-kicker">PARTICIPANTS</span><div class="d-participants"><div class="d-person">${avatar('Maya','M')}<div><strong>Maya</strong><span>Product</span></div></div><div class="d-person">${avatar('Priya','P','orange')}<div><strong>Priya</strong><span>Design</span></div></div><div class="d-person">${avatar('Leo','L','green')}<div><strong>Leo</strong><span>Engineering</span></div></div></div><div class="d-divider"></div><span class="d-kicker">ACTIVE AGENT</span><div class="d-agent"><div class="d-agent-icon">π</div><div><strong>Pi · Leo’s machine</strong><span>Active and ready</span></div></div></aside><section class="d-center"><div class="d-center-head"><span>SHARED PLAN · READ ONLY</span><button class="btn blue" onclick="sendToAgent()">Send to agent ↗</button></div><article class="d-artifact"><div class="d-artifact-head"><h2>Onboarding should feel like a welcome, not a checklist.</h2><p>The team wants to reduce signup drop-off without changing the existing auth contract or profile API.</p></div><div class="d-artifact-body"><div class="d-plan-block"><span>Pi’s latest direction</span><ol><li>Add an incomplete-profile state.</li><li>Split onboarding into three small steps.</li><li>Guard dashboard access until minimum fields are complete.</li></ol></div><div class="d-reference"><div class="mock-shot"><div class="mock-shot-top"><i></i><i></i><i></i></div><div class="mock-shot-body"><div class="mock-nav"><b></b><span></span><span></span></div><div class="mock-main"><h4></h4><div class="mock-card-row"><div class="mock-card"></div><div class="mock-card"></div></div></div></div></div><p>1 design screenshot is attached to the next handoff when Pi’s model supports vision.</p></div></div></article></section><aside class="d-discussion"><span class="d-kicker">DISCUSSION · 4 MESSAGES</span>${timeline()}${composer()}</aside></main></div>`;
    }
    function switcher() { const item = variants.find(v => v.key === current); return `<div class="switcher"><button aria-label="Previous variant" onclick="step(-1)">‹</button><span class="switcher-label">${item.key} — ${item.name}</span><button aria-label="Next variant" onclick="step(1)">›</button></div>`; }
    function render() { const body = current === 'A' ? variantA() : current === 'B' ? variantB() : current === 'C' ? variantC() : variantD(); document.getElementById('app').innerHTML = body + switcher(); }
    function setVariant(key) { current = key; const next = new URL(location.href); next.searchParams.set('variant', key); history.replaceState({}, '', next); render(); }
    function step(amount) { const index = variants.findIndex(v => v.key === current); setVariant(variants[(index + amount + variants.length) % variants.length].key); }
    function copyRoom() { navigator.clipboard?.writeText('https://multi-ai.vercel.app/r/abc123'); alert('Invite copied — prototype room link'); }
    function sendToRoom() { const input = document.getElementById('composerInput'); if (!input?.value.trim()) return; messages.push({ person: 'You', initials: 'Y', color: 'gray', time: 'now', text: input.value.trim() }); render(); }
    function sendToAgent() { const state = document.getElementById('sendState'); if (state) { state.classList.add('visible'); setTimeout(() => state.classList.remove('visible'), 2500); } }
    function attachFile(event) { const file = event.target.files[0]; if (!file) return; const preview = document.getElementById('attachPreview'); const thumb = document.getElementById('attachThumb'); document.getElementById('attachName').textContent = file.name; preview.classList.add('visible'); const reader = new FileReader(); reader.onload = e => thumb.src = e.target.result; reader.readAsDataURL(file); }
    function clearAttachment() { document.getElementById('attachPreview')?.classList.remove('visible'); }
    window.addEventListener('keydown', event => { if (['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) return; if (event.key === 'ArrowRight') step(1); if (event.key === 'ArrowLeft') step(-1); });
    render();
  </script>
</body>
</html>
